<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No zoom: maximum-scale=1 is what stops iOS zooming in when a field takes
         focus (it applies even when text ends up under 16px, e.g. the "Small"
         text size), user-scalable=no stops pinch on Android. iOS ignores that
         part, so pinch is also blocked in src/lib/noZoom.js. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>TaskFlow</title>

    <!-- Paint the right theme before first paint so a reload never flashes.
         Mirrors context/ThemeContext.js: Light is the default, System follows
         the OS. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('tf-theme-mode') || 'light';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.setAttribute('data-theme', dark ? 'dark' : 'light');
          r.style.backgroundColor = dark ? '#111112' : '#ffffff';
          r.classList.add('tf-boot');
        } catch (e) {}
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- PWA / installable app -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TaskFlow" />

    <!-- Meta tags -->
    <meta name="description" content="TaskFlow — track, prioritise and ship feedback faster." />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:title" content="TaskFlow — Ticketing" />
    <meta property="og:description" content="Track, prioritise and ship feedback faster." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
